services:
  runtime:
    image: droneaid/runtime:local
    build:
      context: .
      args:
        VIVA_TAG: ${VIVA_TAG:-alpine}
    env_file: .env
    environment:
      VIVA_INSTANCE_MOUNT: /viva/instance
      VIVA_RUNTIME_ORIGIN: http://0.0.0.0:2501
      PUBLIC_VIVA_RUNTIME_REMOTE: ${PUBLIC_VIVA_RUNTIME_REMOTE:-http://localhost:2501/}
      VIVA_CLIENT_ANIMA_ORIGIN: ${VIVA_CLIENT_ANIMA_ORIGIN:-http://localhost:1794}
    volumes:
      - ./:/viva/instance:ro
      - ./ledger.viva.json:/viva/ledger/ledger.viva.json:ro
      - mountpoint:/viva/mountpoint
    ports:
      - "${RUNTIME_PORT:-2501}:2501"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2501/beacon/status"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  anima:
    image: registry.vivalence.org/beef/viva/vivalence/anima:${VIVA_TAG:-alpine}
    environment:
      VIVA_INSTANCE_MOUNT: /viva/instance
      VIVA_MOUNTPOINT_MOUNT: /viva/mountpoint
      PUBLIC_VIVA_RUNTIME_REMOTE: ${PUBLIC_VIVA_RUNTIME_REMOTE:-http://localhost:2501/}
      PUBLIC_VIVA_CLIENT_ANIMA_REMOTE: ${VIVA_CLIENT_ANIMA_ORIGIN:-http://localhost:1794}/
    volumes:
      - ./:/viva/instance:ro
      - ./ledger.viva.json:/viva/ledger/ledger.viva.json:ro
    ports:
      - "${ANIMA_PORT:-1794}:1794"
    depends_on:
      runtime:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mountpoint:
